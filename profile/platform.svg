</g>
<g font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#57594f">
<text x="776" y="85">coordinates who may do what</text>
<text x="780" y="262">runs it; the work outlives the worker</text>
<text x="660" y="340">records what happened</text>
</g>
