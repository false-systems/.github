<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="t d">
<title id="t">One piece of work, three responsibilities</title>
<desc id="d">People and agents start a piece of work, drawn as a circle. Control Plane, above it, coordinates who may do what. Habitat, to its right, runs it on replaceable workers. Evidence, below it, keeps a record of what happened.</desc>
