<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="t d">
<title id="t">How the four tools fit</title>
<desc id="d">A piece of work moves left to right through five steps: start, check, review, land, deploy. toimija starts it; sykli checks, reviews, lands and deploys it. Above the row, ohjaa holds what agents know. Below it, vessa counts what agents used. </desc>
